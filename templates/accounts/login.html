{% extends 'base.html' %}
{% load i18n %}

{% block title %}
{% trans "Connexion" %}
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                🔐 {% trans "Connexion" %}
            </h2>


            {% if error %}

                <div class="alert alert-danger">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- Nom d'utilisateur -->

                <div class="mb-3">

                    <label for="username" class="form-label">
                        {% trans "Nom d'utilisateur" %}
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Mot de passe -->

                <div class="mb-3">

                    <label for="password" class="form-label">
                        {% trans "Mot de passe" %}
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Bouton connexion -->

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    🔐 {% trans "Se connecter" %}
                </button>

            </form>


            <hr>


            <p class="text-center">

                {% trans "Vous n'avez pas encore de compte ?" %}

                <a href="{% url 'register' %}">
                    {% trans "Créer un compte" %}
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
