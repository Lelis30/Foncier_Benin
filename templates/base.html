<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Foncier Bénin
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Notre CSS -->
    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'home' %}"
        >
            🗺️ Foncier Bénin
        </a>


        <div class="d-flex align-items-center gap-2">

            {% if user.is_authenticated %}

                {% if user.is_staff %}

                    <a
                        class="btn btn-warning"
                        href="{% url 'admin_dashboard' %}"
                    >
                        ⚙️ Administration
                    </a>

                {% else %}

                    <a
                        class="btn btn-light"
                        href="{% url 'user_dashboard' %}"
                    >
                        🏠 Dashboard
                    </a>

                {% endif %}


                <a
                    class="btn btn-danger"
                    href="{% url 'logout' %}"
                >
                    🚪 Déconnexion
                </a>

            {% else %}

                <a
                    class="btn btn-light"
                    href="{% url 'login' %}"
                >
                    🔐 Connexion
                </a>

                <a
                    class="btn btn-success"
                    href="{% url 'register' %}"
                >
                    👤 Inscription
                </a>

            {% endif %}


            <!-- Choix de langue -->

            <form
                action="{% url 'set_language' %}"
                method="post"
            >

                {% csrf_token %}

                <select
                    name="language"
                    onchange="this.form.submit()"
                    class="form-select"
                >

                    <option value="fr">
                        🇫🇷 Français
                    </option>

                    <option value="en">
                        🇬🇧 English
                    </option>

                </select>

            </form>

        </div>

    </div>

</nav>


<main class="container py-4">

    {% block content %}

    {% endblock %}

</main>


<footer class="text-center p-4">

    <p>
        © 2026 Foncier Bénin
    </p>

</footer>


</body>

</html>
